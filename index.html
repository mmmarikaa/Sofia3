<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sofi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07090e;
            color: #f3f4f6;
            touch-action: manipulation;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .particle {
            position: absolute;
            background: rgba(168, 85, 247, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 15s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        #game-canvas {
            background: linear-gradient(to bottom, #0f172a, #090d16);
            touch-action: none;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body class="relative selection:bg-purple-500 selection:text-white px-3 py-4">

    <!-- Background Particles -->
    <div id="particles-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Background Ambient Glows -->
    <div class="absolute top-10 left-1/4 w-80 h-80 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container -->
    <main class="relative z-10 flex flex-col w-full max-w-sm mx-auto">
        
        <!-- Top Bar (Score & Title) -->
        <div class="flex items-center justify-between px-4 py-2.5 rounded-2xl bg-slate-900/80 backdrop-blur-md border border-white/10 mb-3 shadow-lg">
            <h2 class="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-purple-400"></i> Mini-Game
            </h2>
            <div class="flex items-center gap-2 text-xs font-medium text-gray-300">
                <span class="bg-white/5 px-3 py-1 rounded-full border border-white/5">Punti: <span id="score-val" class="text-purple-400 font-bold">0</span></span>
            </div>
        </div>

        <!-- Game Canvas Container (Altezza ottimizzata per smartphone) -->
        <div class="relative w-full h-[62vh] rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
            <canvas id="game-canvas"></canvas>
            
            <!-- Game Overlay / Start Screen -->
            <div id="game-overlay" class="absolute inset-0 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity">
                <div class="w-14 h-14 rounded-full bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-purple-300 mb-3 text-xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-heart animate-pulse"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-2">Pronta?</h3>
                <p class="text-xs text-gray-300 mb-5 max-w-xs leading-relaxed">Muovi il dito sullo schermo per raccogliere cuori e stelle. Ogni 150 punti... sorpresa con battuta! 😄</p>
                <button onclick="startGame()" class="px-7 py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-xs shadow-xl shadow-purple-500/30 transition transform active:scale-95 cursor-pointer">
                    Inizia a giocare 🎮
                </button>
            </div>

            <!-- Joke Popup Overlay (Ogni 150 punti) -->
            <div id="joke-overlay" class="absolute inset-0 bg-black/90 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center z-30 hidden">
                <div class="w-12 h-12 rounded-full bg-purple-500/20 border border-purple-400/40 flex items-center justify-center text-purple-300 mb-2.5 text-lg">
                    🎉
                </div>
                <span class="text-[10px] font-semibold tracking-wider text-purple-400 uppercase mb-1.5" id="joke-milestone">150 PUNTI RAGGIUNTI</span>
                <p id="joke-text" class="text-xs sm:text-sm text-white font-medium mb-5 leading-relaxed max-w-xs px-2">
                    Battuta qui...
                </p>
                <button onclick="resumeGame()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-xs shadow-lg shadow-purple-500/30 transition transform active:scale-95 cursor-pointer">
                    Continua a giocare 
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="game-over-overlay" class="absolute inset-0 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <div class="w-12 h-12 rounded-full bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-300 mb-2.5 text-lg">
                    ⏱️
                </div>
                <h3 class="text-lg font-bold text-white mb-1">Tempo scaduto!</h3>
                <p class="text-xs text-gray-300 mb-5">Hai totalizzato <span id="final-score" class="text-purple-400 font-bold">0</span> punti.</p>
                <button onclick="startGame()" class="px-6 py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-xs shadow-lg shadow-purple-500/30 transition transform active:scale-95 cursor-pointer">
                    Gioca ancora 
                </button>
            </div>
        </div>

    </main>

    <!-- JavaScript Game Logic -->
    <script>
        const jokes = [
            "Se un fiore si fa la doccia, si lavanda?",
            "Per i cavalli l'attenggiamento è importante dipende da come ti pony",
            "Gli scalatori dormono di sasso",
            "un soldato con la colla attacca i nemici",
            "Se lancio una calcolatrice in testa fai un calcolo a mente"
        ];

        // Particles
        const particlesContainer = document.getElementById('particles-container');
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 5 + 3;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}vw`;
            p.style.top = `${Math.random() * 100}vh`;
            p.style.animationDuration = `${Math.random() * 10 + 10}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particlesContainer.appendChild(p);
        }

        // Fullscreen Mini-Game Engine
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameRunning = false;
        let score = 0;
        let gameTime = 30;
        let timerInterval = null;
        let items = [];
        let nextMilestone = 150;
        
        let basket = {
            x: 150,
            y: 0,
            w: 65,
            h: 20,
            speed: 8
        };

        let keys = { ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.key === 'ArrowRight') keys.ArrowRight = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.key === 'ArrowRight') keys.ArrowRight = false;
        });

        let isDragging = false;
        canvas.addEventListener('pointerdown', e => {
            isDragging = true;
            updateBasketPosition(e);
        });
        canvas.addEventListener('pointermove', e => {
            if (isDragging) updateBasketPosition(e);
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        function updateBasketPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX - rect.left;
            basket.x = clientX - basket.w / 2;
            const displayWidth = canvas.width / window.devicePixelRatio;
            if (basket.x < 0) basket.x = 0;
            if (basket.x > displayWidth - basket.w) basket.x = displayWidth - basket.w;
        }

        function startGame() {
            document.getElementById('game-overlay').classList.add('hidden');
            document.getElementById('game-over-overlay').classList.add('hidden');
            document.getElementById('joke-overlay').classList.add('hidden');
            
            score = 0;
            gameTime = 30;
            nextMilestone = 150;
            document.getElementById('score-val').textContent = score;
            items = [];
            gameRunning = true;

            const displayWidth = canvas.width / window.devicePixelRatio;
            const displayHeight = canvas.height / window.devicePixelRatio;
            basket.x = displayWidth / 2 - basket.w / 2;
            basket.y = displayHeight - 45;

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                gameTime--;
                if (gameTime <= 0) {
                    endGame();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function triggerJokePopup() {
            gameRunning = false;
            clearInterval(timerInterval);

            const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
            document.getElementById('joke-text').textContent = randomJoke;
            document.getElementById('joke-milestone').textContent = `${nextMilestone} PUNTI RAGGIUNTI!`;
            
            document.getElementById('joke-overlay').classList.remove('hidden');

            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        function resumeGame() {
            document.getElementById('joke-overlay').classList.add('hidden');
            gameRunning = true;
            nextMilestone += 150;

            timerInterval = setInterval(() => {
                gameTime--;
                if (gameTime <= 0) {
                    endGame();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerInterval);
            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over-overlay').classList.remove('hidden');
        }

        function spawnItem() {
            const displayWidth = canvas.width / window.devicePixelRatio;
            const types = ['heart', 'star'];
            const type = types[Math.floor(Math.random() * types.length)];
            items.push({
                x: Math.random() * (displayWidth - 30),
                y: -30,
                size: 24,
                speed: Math.random() * 1.5 + 3,
                type: type
            });
        }

        let spawnTimer = 0;
        function gameLoop() {
            if (!gameRunning) return;

            const displayWidth = canvas.width / window.devicePixelRatio;
            const displayHeight = canvas.height / window.devicePixelRatio;

            ctx.clearRect(0, 0, displayWidth, displayHeight);

            if (keys.ArrowLeft) basket.x -= basket.speed;
            if (keys.ArrowRight) basket.x += basket.speed;
            if (basket.x < 0) basket.x = 0;
            if (basket.x > displayWidth - basket.w) basket.x = displayWidth - basket.w;

            spawnTimer++;
            if (spawnTimer > 25) {
                spawnItem();
                spawnTimer = 0;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.y += itm.speed;

                ctx.font = `${itm.size}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(itm.type === 'heart' ? '💖' : '⭐', itm.x + itm.size/2, itm.y + itm.size/2);

                if (
                    itm.y + itm.size >= basket.y &&
                    itm.y <= basket.y + basket.h &&
                    itm.x + itm.size >= basket.x &&
                    itm.x <= basket.x + basket.w
                ) {
                    score += (itm.type === 'heart' ? 10 : 15);
                    document.getElementById('score-val').textContent = score;
                    items.splice(i, 1);
                    
                    if (score >= nextMilestone) {
                        triggerJokePopup();
                        return;
                    }
                    continue;
                }

                if (itm.y > displayHeight) {
                    items.splice(i, 1);
                }
            }

            ctx.fillStyle = '#a855f7';
            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(basket.x, basket.y, basket.w, basket.h, [10]);
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
